<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1530"/>
      <stop offset=".45" stop-color="#2b3a7a"/>
      <stop offset=".72" stop-color="#8a6fb8"/>
      <stop offset=".88" stop-color="#f2a26b"/>
      <stop offset="1" stop-color="#f7c58a"/>
    </linearGradient>
    <radialGradient id="sol" cx=".82" cy=".66" r=".45">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caraLuz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4e6"/>
      <stop offset=".5" stop-color="#f3c79a"/>
      <stop offset="1" stop-color="#b9786a"/>
    </linearGradient>
    <linearGradient id="caraSombra" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c5ea8"/>
      <stop offset="1" stop-color="#1a2554"/>
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f6aa8"/>
      <stop offset="1" stop-color="#2a356e"/>
    </linearGradient>
    <linearGradient id="frente" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2550"/>
      <stop offset="1" stop-color="#0b1530"/>
    </linearGradient>
    <linearGradient id="niebla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d7e6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e9d7e6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e9d7e6" stop-opacity="0"/>
    </linearGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="difuso"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1000" height="860" fill="url(#cielo)"/>
  <rect width="1000" height="860" fill="url(#sol)"/>

  <!-- estrellas -->
  <g fill="#fff" opacity=".7">
    <circle cx="120" cy="60" r="1.2"/><circle cx="260" cy="130" r="1"/><circle cx="420" cy="40" r="1.4"/>
    <circle cx="610" cy="90" r="1"/><circle cx="760" cy="30" r="1.2"/><circle cx="900" cy="110" r="1"/>
    <circle cx="340" cy="210" r="1"/><circle cx="560" cy="180" r="1.1"/>
  </g>

  <!-- cordillera de fondo -->
  <path d="M0 640 L90 560 L170 600 L260 520 L340 580 L430 540 L520 600 L700 520 L790 470 L880 530 L1000 480 L1000 860 L0 860 Z" fill="url(#fondo)" opacity=".85"/>

  <!-- marco de luz (detrás de la montaña) -->
  <g fill="none" stroke-linecap="round">
    <path d="M360 420 L360 250 L870 180 L870 700" stroke="#7fd4ff" stroke-width="14" filter="url(#brillo)" opacity=".9"/>
    <path d="M360 420 L360 250 L870 180 L870 700" stroke="#eaf8ff" stroke-width="4"/>
  </g>

  <!-- montaña principal -->
  <path d="M220 760 L470 360 L560 220 L610 300 L660 280 L790 470 L900 560 L1000 600 L1000 860 L180 860 Z" fill="url(#caraSombra)"/>
  <path d="M560 220 L610 300 L660 280 L790 470 L900 560 L1000 600 L1000 760 L700 700 L620 560 L600 420 Z" fill="url(#caraLuz)"/>
  <!-- nieve -->
  <path d="M560 220 L470 360 L505 350 L520 380 L548 340 L572 372 L600 320 L610 300 Z" fill="#eef2ff"/>
  <path d="M560 220 L610 300 L660 280 L690 330 L660 345 L640 330 L618 360 L600 320 Z" fill="#fff8ee"/>
  <g stroke="#ffffff" stroke-opacity=".35" stroke-width="2" fill="none">
    <path d="M560 220 L540 420 L500 560"/><path d="M610 300 L640 470 L700 640"/><path d="M660 280 L760 470"/>
  </g>

  <!-- marco de luz (pilar delante) -->
  <g fill="none" stroke-linecap="round">
    <path d="M870 440 L870 700" stroke="#7fd4ff" stroke-width="16" filter="url(#brillo)"/>
    <path d="M870 440 L870 700" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- niebla -->
  <ellipse cx="560" cy="700" rx="460" ry="60" fill="url(#niebla)" filter="url(#difuso)"/>
  <ellipse cx="860" cy="660" rx="220" ry="40" fill="#f6dcc6" opacity=".35" filter="url(#difuso)"/>

  <!-- primer plano -->
  <path d="M0 780 L140 730 L300 770 L470 720 L640 760 L820 720 L1000 750 L1000 860 L0 860 Z" fill="url(#frente)"/>
</svg>
